name: Desktop installers

# Builds the macOS .dmg (Apple Silicon only) and the Windows .exe/.msi installers.
#
# Cross-compiling Tauri bundles is not supported: the macOS bundle needs
# Xcode tooling and the Windows bundle needs the MSVC toolchain + WebView2.
# Building each target on its own runner is the only reliable path.
#
# Required repository secret:
#   VITE_SPOTIFY_CLIENT_ID   — same public client id used locally.
# Optional (macOS signing/notarization):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Pushing a `v*` tag also publishes a GitHub Release with the installers
# attached, so the files can be downloaded without being signed in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

  macos:
    name: macOS (dmg, Apple Silicon)
    needs: verify
    # Apple Silicon only. The app targets M-series Macs (macOS 12+), so there is
    # no x86_64 slice to cross-compile and no Rosetta fallback to maintain.
    # `macos-latest` is an arm64 runner; the larger arm64 pool occasionally
    # fails to acquire a machine, in which case the job simply retries.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build arm64 DMG
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: harmonic-playlist-macos
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (exe)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri 2 wants a comma- (or space-) separated value list here; passing
      # `--bundles nsis msi` makes `msi` a stray positional argument.
      - name: Build NSIS installer + MSI
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run tauri build -- --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: harmonic-playlist-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    # A macOS runner that GitHub never acquires must not block installers that
    # already built. Publish whatever artifacts exist and let the missing
    # platform show up as an absent file rather than an unpublished release.
    if: |
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected installers
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/harmonic-playlist-macos/*.dmg
            artifacts/harmonic-playlist-windows/**/*.exe
            artifacts/harmonic-playlist-windows/**/*.msi
          fail_on_unmatched_files: false
          generate_release_notes: true
