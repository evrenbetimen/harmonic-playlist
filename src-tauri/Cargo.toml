[package]
name = "harmonic-playlist"
version = "0.1.1"
description = "Camelot-aware, energy-profiled DJ set builder for Spotify"
authors = ["Harmonic Playlist"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harmonic_playlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
